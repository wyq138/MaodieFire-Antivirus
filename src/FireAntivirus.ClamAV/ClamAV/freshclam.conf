# freshclam.conf 配置文件
# 用于自动更新ClamAV病毒数据库

# 指定数据库更新服务器
DatabaseMirror database.clamav.net
DatabaseMirror database.clamav.net

# 数据库更新频率（单位：秒）
# 4小时更新一次
Checks 6

# 最大尝试次数
MaxAttempts 5

# 连接超时（秒）
ConnectTimeout 60

# 接收超时（秒）
ReceiveTimeout 60

# 数据库目录
DatabaseDirectory ./db

# 日志文件
UpdateLogFile ./freshclam.log

# 详细日志
LogVerbose yes

# 启用DNS数据库验证
DNSDatabaseInfo current.cvd.clamav.net

# 启用安全检查
SafeBrowsing yes

# 禁用脚本检测（可选）
# ScriptedUpdates no

# HTTP代理（如果需要）
# HTTPProxyServer http://proxy.example.com:8080
# HTTPProxyUsername username
# HTTPProxyPassword password